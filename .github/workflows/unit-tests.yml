name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests with coverage
        run: |
          go test -tags=unit -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Generate coverage badge JSON
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          COLOR="red"
          if awk "BEGIN {exit !($COVERAGE >= 90)}"; then
            COLOR="brightgreen"
          elif awk "BEGIN {exit !($COVERAGE >= 80)}"; then
            COLOR="green"
          elif awk "BEGIN {exit !($COVERAGE >= 70)}"; then
            COLOR="yellowgreen"
          elif awk "BEGIN {exit !($COVERAGE >= 60)}"; then
            COLOR="yellow"
          elif awk "BEGIN {exit !($COVERAGE >= 50)}"; then
            COLOR="orange"
          fi

          mkdir -p .github/badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$COVERAGE" "$COLOR" > .github/badges/coverage.json

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage.out
          path: coverage.out

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- .github/badges/coverage.json; then
            echo "No coverage badge changes to commit"
            exit 0
          fi

          git add .github/badges/coverage.json
          git commit -m "chore(ci): update coverage badge [skip ci]"
          git push

